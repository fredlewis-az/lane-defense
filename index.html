<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Lane Defense</title>
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect fill='%23050810' width='180' height='180'/%3E%3Cpath fill='%2300e5ff' d='M90 40 L130 120 L110 120 L110 140 L70 140 L70 120 L50 120 Z'/%3E%3C/svg%3E">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050810;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    #wrap {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050810;
    }
    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #touch-ui {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: none;
    }
    #touch-ui.active { display: block; }
    .tbtn {
      position: absolute;
      pointer-events: auto;
      border: 2px solid rgba(0, 229, 255, 0.45);
      background: rgba(0, 229, 255, 0.12);
      color: #00e5ff;
      font: 600 14px/1 system-ui, sans-serif;
      border-radius: 8px;
      touch-action: none;
    }
    .tbtn:active { background: rgba(0, 229, 255, 0.35); }
    #btn-left { left: 12px; bottom: 18px; width: 72px; height: 72px; }
    #btn-right { left: 96px; bottom: 18px; width: 72px; height: 72px; }
    #btn-fire {
      right: 12px; bottom: 18px; width: 88px; height: 72px;
      border-color: rgba(255, 200, 80, 0.5);
      background: rgba(255, 200, 80, 0.15);
      color: #ffc850;
      font-size: 16px;
    }
    #btn-fire:active { background: rgba(255, 200, 80, 0.4); }
    #btn-pause {
      top: max(8px, env(safe-area-inset-top));
      right: max(8px, env(safe-area-inset-right));
      width: 44px; height: 36px;
      font-size: 11px;
      padding: 0;
    }
    #btn-mute {
      top: max(8px, env(safe-area-inset-top));
      right: max(58px, calc(8px + env(safe-area-inset-right) + 44px));
      width: 44px; height: 36px;
      font-size: 18px;
      line-height: 1;
      padding: 0;
    }
    #touch-ui { z-index: 4; }
    #ver-link {
      position: fixed;
      z-index: 8;
      top: max(8px, env(safe-area-inset-top));
      left: max(8px, env(safe-area-inset-left));
      display: inline-flex;
      align-items: center;
      min-height: 36px;
      padding: 8px 12px;
      color: #7cff6b;
      font: 600 12px/1 system-ui, sans-serif;
      letter-spacing: 0.03em;
      text-decoration: none;
      border-radius: 6px;
      border: 1px solid rgba(124, 255, 107, 0.55);
      background: rgba(5, 8, 16, 0.88);
    }
    #ver-link[hidden] { display: none !important; }
  </style>
</head>
<body>
  <audio id="silent-unlock" loop playsinline preload="auto" style="display:none" src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAA="></audio>
  <div id="wrap"><canvas id="game" width="480" height="640"></canvas></div>
  <div id="touch-ui">
    <button type="button" class="tbtn" id="btn-left" aria-label="Move left">◀</button>
    <button type="button" class="tbtn" id="btn-right" aria-label="Move right">▶</button>
    <button type="button" class="tbtn" id="btn-fire" aria-label="Fire">FIRE</button>
    <button type="button" class="tbtn" id="btn-mute" aria-label="Mute">🔊</button>
    <button type="button" class="tbtn" id="btn-pause" aria-label="Pause">II</button>
  </div>
  <a id="ver-link" href="classic/" title="Play the classic version">Classic →</a>
  <script>
(function () {
  'use strict';

  const W = 480, H = 640;
  const BUILD_VERSION = 'v1.2';
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const touchUi = document.getElementById('touch-ui');

  const ROWS = 5, COLS = 11;
  const ROW_POINTS = [30, 30, 20, 20, 10];
  const INV_COLORS = ['#7cff6b', '#7cff6b', '#ffb84d', '#ffb84d', '#7cff6b'];
  const HS_KEY = 'laneDefenseHighScores_v1';
  const MAX_HS = 10;

  let storageOk = true;
  try {
    const t = '__ld_test__';
    localStorage.setItem(t, '1');
    localStorage.removeItem(t);
  } catch (e) {
    storageOk = false;
  }

  const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
  if (isTouch) touchUi.classList.add('active');

  const touch = { left: false, right: false, fire: false };

  function bindTouchBtn(id, onDown, onUp) {
    const el = document.getElementById(id);
    const down = (e) => { e.preventDefault(); onDown(); };
    const up = (e) => { e.preventDefault(); onUp(); };
    el.addEventListener('touchstart', down, { passive: false });
    el.addEventListener('touchend', up, { passive: false });
    el.addEventListener('touchcancel', up, { passive: false });
    el.addEventListener('mousedown', down);
    el.addEventListener('mouseup', up);
    el.addEventListener('mouseleave', up);
  }
  bindTouchBtn('btn-left', () => { touch.left = true; }, () => { touch.left = false; });
  bindTouchBtn('btn-right', () => { touch.right = true; }, () => { touch.right = false; });
  bindTouchBtn('btn-fire', () => { touch.fire = true; firePressed(); }, () => { touch.fire = false; });
  document.getElementById('btn-pause').addEventListener('click', (e) => {
    e.preventDefault();
    if (state === 'playing') togglePause();
    else if (state === 'paused') togglePause();
  });
  document.getElementById('btn-mute').addEventListener('click', (e) => {
    e.preventDefault();
    ensureAudio();
    toggleMute();
  });

  let state = 'start';
  let score = 0, lives = 3, wave = 1, hiScore = 0;
  let muted = false;
  let shakeT = 0;

  let player = { x: W / 2 - 16, y: H - 56, w: 32, h: 16, speed: 4.5 };
  let bullet = null;
  let invaders = [];
  let invDir = 1;
  let invStepY = 0;
  let invMoveAcc = 0;
  let invMoveInterval = 0.45;
  let invFireAcc = 0;
  let shields = [];

  let initials = ['A', 'A', 'A'];
  let initialIdx = 0;
  let pendingScore = 0;

  let audioCtx = null;
  let marchStepIdx = 0;
  const MARCH_NOTES = [110, 98, 87, 82];
  let audioNeedsUnlock = true;
  const silentUnlockEl = document.getElementById('silent-unlock');

  function setAudioSessionPlayback() {
    try {
      if (navigator.audioSession) navigator.audioSession.type = 'playback';
    } catch (e) { /* ignore */ }
  }

  function playSilentHtmlAudio() {
    if (!silentUnlockEl) return;
    try {
      silentUnlockEl.volume = 0.0001;
      const p = silentUnlockEl.play();
      if (p && typeof p.catch === 'function') p.catch(() => {});
    } catch (e) { /* ignore */ }
  }

  function playSilentBufferSync() {
    if (!audioCtx) return;
    try {
      const buf = audioCtx.createBuffer(1, 1, audioCtx.sampleRate);
      const src = audioCtx.createBufferSource();
      src.buffer = buf;
      src.connect(audioCtx.destination);
      src.start(0);
      src.stop(0);
    } catch (e) { /* ignore */ }
  }

  function audioCtxNeedsResume() {
    if (!audioCtx) return true;
    const s = audioCtx.state;
    return s === 'suspended' || s === 'interrupted';
  }

  function unlockAudioSync() {
    setAudioSessionPlayback();
    playSilentHtmlAudio();
    try {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      playSilentBufferSync();
      if (audioCtxNeedsResume()) {
        audioCtx.resume();
      }
    } catch (e) { /* ignore */ }
    audioNeedsUnlock = !audioCtx || audioCtx.state !== 'running';
  }

  function unlockAudioFromGesture() {
    unlockAudioSync();
    if (audioCtx && audioCtxNeedsResume()) {
      audioCtx.resume().then(() => {
        audioNeedsUnlock = audioCtx.state !== 'running';
      }).catch(() => {
        audioNeedsUnlock = true;
      });
    } else if (audioCtx && audioCtx.state === 'running') {
      audioNeedsUnlock = false;
    }
  }

  function markAudioNeedsUnlockOnReturn() {
    if (!audioCtx) {
      audioNeedsUnlock = true;
      return;
    }
    if (audioCtxNeedsResume()) audioNeedsUnlock = true;
  }

  ['touchend', 'pointerup', 'click'].forEach((ev) => {
    window.addEventListener(ev, unlockAudioFromGesture, { passive: true, capture: true });
  });
  window.addEventListener('keydown', unlockAudioFromGesture, { passive: true });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') markAudioNeedsUnlockOnReturn();
  });
  window.addEventListener('pageshow', markAudioNeedsUnlockOnReturn);
  window.addEventListener('focus', markAudioNeedsUnlockOnReturn);

  function ensureAudio() {
    unlockAudioSync();
    if (!audioCtx) return Promise.resolve(false);
    if (audioCtx.state === 'running') {
      audioNeedsUnlock = false;
      return Promise.resolve(true);
    }
    if (audioCtxNeedsResume()) {
      return audioCtx.resume().then(() => {
        audioNeedsUnlock = audioCtx.state !== 'running';
        return audioCtx.state === 'running';
      }).catch(() => false);
    }
    audioNeedsUnlock = audioCtx.state !== 'running';
    return Promise.resolve(audioCtx.state === 'running');
  }

  function audioTime() {
    return audioCtx ? audioCtx.currentTime : 0;
  }

  function sfxBlocked() {
    return muted || !audioCtx;
  }

  function toggleMute() {
    muted = !muted;
    const btn = document.getElementById('btn-mute');
    if (btn) btn.textContent = muted ? '🔇' : '🔊';
  }

  function sfxPlayerShot() {
    if (sfxBlocked()) return;
    const t = audioTime();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(920, t);
    o.frequency.exponentialRampToValueAtTime(180, t + 0.11);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.055, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start(t);
    o.stop(t + 0.12);
  }

  function sfxMarchStep() {
    if (sfxBlocked()) return;
    const f = MARCH_NOTES[marchStepIdx & 3];
    marchStepIdx++;
    const t = audioTime();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0.07, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.085);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start(t);
    o.stop(t + 0.09);
  }

  function sfxInvaderKill() {
    if (sfxBlocked()) return;
    const t = audioTime();
    for (let i = 0; i < 12; i++) {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = i % 2 ? 'square' : 'sawtooth';
      o.frequency.setValueAtTime(180 + Math.random() * 1400, t);
      const dur = 0.03 + Math.random() * 0.045;
      g.gain.setValueAtTime(0.022, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g);
      g.connect(audioCtx.destination);
      o.start(t);
      o.stop(t + dur + 0.01);
    }
  }

  function sfxPlayerHit() {
    if (sfxBlocked()) return;
    const t = audioTime();
    for (let i = 0; i < 4; i++) {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sawtooth';
      const start = t + i * 0.018;
      o.frequency.setValueAtTime(140 - i * 15, start);
      o.frequency.exponentialRampToValueAtTime(28, start + 0.48);
      g.gain.setValueAtTime(0.0001, start);
      g.gain.exponentialRampToValueAtTime(0.065, start + 0.025);
      g.gain.exponentialRampToValueAtTime(0.0001, start + 0.5);
      o.connect(g);
      g.connect(audioCtx.destination);
      o.start(start);
      o.stop(start + 0.52);
    }
  }

  function sfxWaveClear() {
    if (sfxBlocked()) return;
    const notes = [392, 523.25, 659.25, 783.99];
    const t0 = audioTime();
    notes.forEach((freq, i) => {
      const t = t0 + i * 0.09;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'square';
      o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.045, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);
      o.connect(g);
      g.connect(audioCtx.destination);
      o.start(t);
      o.stop(t + 0.12);
    });
  }

  function sfxGameOver() {
    if (sfxBlocked()) return;
    const t = audioTime();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(220, t);
    o.frequency.exponentialRampToValueAtTime(48, t + 0.75);
    g.gain.setValueAtTime(0.055, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.8);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start(t);
    o.stop(t + 0.82);
  }

  function loadHighScores() {
    if (!storageOk) return [];
    try {
      const raw = localStorage.getItem(HS_KEY);
      if (!raw) return [];
      const arr = JSON.parse(raw);
      if (!Array.isArray(arr)) return [];
      return arr.slice(0, MAX_HS);
    } catch (e) { return []; }
  }

  function saveHighScores(list) {
    if (!storageOk) return;
    try { localStorage.setItem(HS_KEY, JSON.stringify(list.slice(0, MAX_HS))); } catch (e) {}
  }

  function updateHiFromStorage() {
    const list = loadHighScores();
    hiScore = list.length ? list[0].score : 0;
  }

  function qualifiesForTable(s) {
    const list = loadHighScores();
    if (list.length < MAX_HS) return true;
    return s > list[list.length - 1].score;
  }

  function addHighScore(initialsStr, s) {
    const list = loadHighScores();
    list.push({ initials: initialsStr, score: s });
    list.sort((a, b) => b.score - a.score);
    saveHighScores(list);
    updateHiFromStorage();
  }

  const SHIELD_PATTERN = [
    '    XXXX    ',
    '  XXXXXXXXXX  ',
    ' XXXXXXXXXXXX ',
    'XXXXXXXXXXXXXX',
    'XXXXXXXXXXXXXX',
    'XXXXXX  XXXXXX',
    'XXXXX    XXXXX',
    'XXXX      XXXX',
  ];

  function makeShield(cx, cy) {
    const cell = 4;
    const blocks = [];
    for (let r = 0; r < SHIELD_PATTERN.length; r++) {
      const row = SHIELD_PATTERN[r];
      for (let c = 0; c < row.length; c++) {
        if (row[c] === 'X') {
          blocks.push({ x: cx + c * cell - (row.length * cell) / 2, y: cy + r * cell, w: cell, h: cell, alive: true });
        }
      }
    }
    return blocks;
  }

  function resetShields() {
    const y = H - 140;
    const spacing = W / 5;
    shields = [
      makeShield(spacing, y),
      makeShield(spacing * 2, y),
      makeShield(spacing * 3, y),
      makeShield(spacing * 4, y),
    ];
  }

  function spawnInvaders() {
    invaders = [];
    const iw = 28, ih = 20, gapX = 8, gapY = 10;
    const totalW = COLS * iw + (COLS - 1) * gapX;
    const startX = (W - totalW) / 2;
    const startY = 72;
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        invaders.push({
          x: startX + c * (iw + gapX),
          y: startY + r * (ih + gapY),
          w: iw, h: ih,
          row: r, col: c,
          alive: true,
          anim: 0,
        });
      }
    }
    invDir = 1;
    invStepY = 0;
    invMoveAcc = 0;
    invFireAcc = 0;
    const base = 0.42 - wave * 0.02;
    invMoveInterval = Math.max(0.12, base);
  }

  function livingInvaders() {
    return invaders.filter((i) => i.alive);
  }

  function resetGame(full) {
    score = full ? 0 : score;
    lives = 3;
    wave = full ? 1 : wave;
    player.x = W / 2 - 16;
    bullet = null;
    invaderBullets = [];
    resetShields();
    spawnInvaders();
    shakeT = 0;
  }

  let invaderBullets = [];

  function restartFull() {
    state = 'playing';
    score = 0;
    lives = 3;
    wave = 1;
    resetGame(true);
  }

  function startWave() {
    wave++;
    bullet = null;
    invaderBullets = [];
    resetShields();
    spawnInvaders();
  }

  function togglePause() {
    if (state === 'playing') state = 'paused';
    else if (state === 'paused') state = 'playing';
  }

  function firePressed() {
    ensureAudio();
    if (state !== 'playing' || bullet) return;
    bullet = { x: player.x + player.w / 2 - 2, y: player.y - 8, w: 4, h: 10, vy: -9 };
    sfxPlayerShot();
  }

  const keys = {};
  window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    if (e.code === 'KeyP') { e.preventDefault(); togglePause(); }
    if (e.code === 'KeyR') {
      e.preventDefault();
      if (state === 'gameover') goRetry();
      else { restartFull(); state = 'playing'; }
    }
    if (e.code === 'KeyM') { ensureAudio(); toggleMute(); }
    if (e.code === 'Space') { e.preventDefault(); firePressed(); }
    if (state === 'start' && (e.code === 'Enter' || e.code === 'Space')) {
      e.preventDefault();
      state = 'playing';
      restartFull();
    }
    if (state === 'gameover' && e.code === 'KeyR') {
      e.preventDefault();
      goRetry();
    }
    if (state === 'initials') handleInitialsKey(e);
    if (state === 'scores' && (e.code === 'Enter' || e.code === 'Space' || e.code === 'KeyR')) {
      state = 'start';
    }
  });
  window.addEventListener('keyup', (e) => { keys[e.code] = false; });

  function goRetry() {
    if (qualifiesForTable(score)) {
      pendingScore = score;
      initials = ['A', 'A', 'A'];
      initialIdx = 0;
      state = 'initials';
    } else {
      state = 'start';
      resetGame(true);
    }
  }

  function handleInitialsKey(e) {
    if (e.code === 'ArrowLeft') { initialIdx = Math.max(0, initialIdx - 1); e.preventDefault(); return; }
    if (e.code === 'ArrowRight') { initialIdx = Math.min(2, initialIdx + 1); e.preventDefault(); return; }
    if (e.code === 'ArrowUp') {
      initials[initialIdx] = nextLetter(initials[initialIdx], 1);
      e.preventDefault(); return;
    }
    if (e.code === 'ArrowDown') {
      initials[initialIdx] = nextLetter(initials[initialIdx], -1);
      e.preventDefault(); return;
    }
    if (e.key.length === 1 && /[a-zA-Z]/.test(e.key)) {
      initials[initialIdx] = e.key.toUpperCase();
      if (initialIdx < 2) initialIdx++;
      e.preventDefault(); return;
    }
    if (e.code === 'Enter') {
      submitInitials();
      e.preventDefault();
    }
  }

  function nextLetter(ch, dir) {
    const code = ch.charCodeAt(0);
    let n = code + dir;
    if (n < 65) n = 90;
    if (n > 90) n = 65;
    return String.fromCharCode(n);
  }

  function submitInitials() {
    addHighScore(initials.join(''), pendingScore);
    state = 'scores';
  }

  canvas.addEventListener('click', onTap);
  canvas.addEventListener('touchend', (e) => {
    if (e.target !== canvas) return;
    onTap(e);
  });

  function onTap(e) {
    if (e.type === 'touchend') e.preventDefault();
    ensureAudio();
    if (state === 'start') {
      state = 'playing';
      restartFull();
      return;
    }
    if (state === 'gameover') {
      goRetry();
      return;
    }
    if (state === 'scores') {
      state = 'start';
      resetGame(true);
    }
    if (state === 'initials') {
      const rect = canvas.getBoundingClientRect();
      const sx = W / rect.width;
      const sy = H / rect.height;
      let cx, cy;
      if (e.changedTouches && e.changedTouches[0]) {
        cx = (e.changedTouches[0].clientX - rect.left) * sx;
        cy = (e.changedTouches[0].clientY - rect.top) * sy;
      } else {
        cx = (e.clientX - rect.left) * sx;
        cy = (e.clientY - rect.top) * sy;
      }
      handleInitialsTap(cx, cy);
    }
  }

  let initialsTouch = { lastX: 0 };

  function handleInitialsTap(cx, cy) {
    const centerY = H * 0.52;
    const letterSpacing = 56;
    const startX = W / 2 - letterSpacing;
    for (let i = 0; i < 3; i++) {
      const lx = startX + i * letterSpacing;
      if (Math.abs(cx - lx) < 36 && Math.abs(cy - centerY) < 40) {
        if (initialsTouch.lastX && Math.abs(cx - initialsTouch.lastX) < 8) {
          initials[i] = nextLetter(initials[i], 1);
        } else {
          initialIdx = i;
        }
        initialsTouch.lastX = cx;
        return;
      }
    }
    if (cy > centerY + 50 && cy < centerY + 100 && cx > W / 2 - 60 && cx < W / 2 + 60) {
      submitInitials();
      return;
    }
    if (cx < initialIdx * 40 + startX) initialIdx = Math.max(0, initialIdx - 1);
    else if (cx > startX + initialIdx * letterSpacing + 20) initialIdx = Math.min(2, initialIdx + 1);
  }

  function resize() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const scale = Math.min(vw / W, vh / H);
    const cw = Math.floor(W * scale);
    const ch = Math.floor(H * scale);
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
  }
  window.addEventListener('resize', resize);
  resize();

  function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function hitShields(rect, remove) {
    for (const shield of shields) {
      for (const b of shield) {
        if (!b.alive) continue;
        if (rectsOverlap(rect, b)) {
          if (remove) b.alive = false;
          return true;
        }
      }
    }
    return false;
  }

  function invaderSpeedFactor() {
    const alive = livingInvaders().length;
    const total = ROWS * COLS;
    return 1 + (total - alive) * 0.04;
  }

  let lastT = 0;

  function update(dt) {
    if (state !== 'playing') return;

    let mx = 0;
    if (keys.ArrowLeft || keys.KeyA || touch.left) mx -= 1;
    if (keys.ArrowRight || keys.KeyD || touch.right) mx += 1;
    player.x += mx * player.speed;
    player.x = Math.max(8, Math.min(W - player.w - 8, player.x));

    if (touch.fire && !bullet) firePressed();

    if (bullet) {
      bullet.y += bullet.vy;
      if (bullet.y < 40) bullet = null;
      else {
        const br = { x: bullet.x, y: bullet.y, w: bullet.w, h: bullet.h };
        if (hitShields(br, true)) bullet = null;
        else {
          for (const inv of invaders) {
            if (!inv.alive) continue;
            if (rectsOverlap(br, inv)) {
              inv.alive = false;
              bullet = null;
              score += ROW_POINTS[inv.row];
              sfxInvaderKill();
              break;
            }
          }
        }
      }
    }

    const alive = livingInvaders();
    if (alive.length === 0) {
      sfxWaveClear();
      startWave();
      return;
    }

    invMoveAcc += dt * invaderSpeedFactor();
    while (invMoveAcc >= invMoveInterval) {
      invMoveAcc -= invMoveInterval;
      let minX = Infinity, maxX = -Infinity;
      for (const inv of alive) {
        minX = Math.min(minX, inv.x);
        maxX = Math.max(maxX, inv.x + inv.w);
      }
      const step = invDir * 6;
      let hitEdge = false;
      if (minX + step < 16) hitEdge = true;
      if (maxX + step > W - 16) hitEdge = true;
      if (hitEdge) {
        invDir *= -1;
        for (const inv of invaders) {
          if (inv.alive) inv.y += 14;
        }
      } else {
        for (const inv of invaders) {
          if (inv.alive) inv.x += step;
        }
      }
      sfxMarchStep();
      for (const inv of alive) {
        inv.anim = 1 - inv.anim;
      }
    }

    for (const inv of alive) {
      if (inv.y + inv.h >= player.y - 4) {
        gameOver();
        return;
      }
    }

    invFireAcc += dt;
    const fireRate = Math.max(0.35, 1.8 - wave * 0.12 - (ROWS * COLS - alive.length) * 0.02);
    if (invFireAcc >= fireRate) {
      invFireAcc = 0;
      const shooters = alive.filter((i) => i.col === Math.floor(Math.random() * COLS) || Math.random() < 0.15);
      const pool = shooters.length ? shooters : alive;
      const shooter = pool[Math.floor(Math.random() * pool.length)];
      invaderBullets.push({
        x: shooter.x + shooter.w / 2 - 2,
        y: shooter.y + shooter.h,
        w: 4, h: 10, vy: 5 + wave * 0.15,
      });
    }

    for (let i = invaderBullets.length - 1; i >= 0; i--) {
      const b = invaderBullets[i];
      b.y += b.vy;
      const br = { x: b.x, y: b.y, w: b.w, h: b.h };
      if (b.y > H) {
        invaderBullets.splice(i, 1);
        continue;
      }
      if (hitShields(br, true)) {
        invaderBullets.splice(i, 1);
        continue;
      }
      if (rectsOverlap(br, player)) {
        invaderBullets.splice(i, 1);
        playerHit();
        continue;
      }
    }

    if (shakeT > 0) shakeT -= dt;
  }

  function playerHit() {
    lives--;
    shakeT = 0.35;
    bullet = null;
    sfxPlayerHit();
    if (lives <= 0) gameOver();
  }

  function gameOver() {
    state = 'gameover';
    if (score > hiScore) hiScore = score;
    sfxGameOver();
  }

  function drawInvader(inv) {
    const { x, y, w, h, row, anim } = inv;
    const c = INV_COLORS[row];
    ctx.fillStyle = c;
    const bob = anim ? 2 : 0;
    ctx.fillRect(Math.floor(x), Math.floor(y + bob), w, h);
    ctx.fillStyle = '#0a1808';
    const eyeY = y + bob + 6;
    ctx.fillRect(Math.floor(x + 6), Math.floor(eyeY), 5, 5);
    ctx.fillRect(Math.floor(x + w - 11), Math.floor(eyeY), 5, 5);
    ctx.fillStyle = c;
    ctx.fillRect(Math.floor(x + 4), Math.floor(y + bob + h - 6), w - 8, 4);
    if (row < 2) {
      ctx.fillRect(Math.floor(x + w / 2 - 3), Math.floor(y + bob - 2), 6, 4);
    }
  }

  function drawPlayer() {
    const { x, y, w, h } = player;
    ctx.fillStyle = '#00e5ff';
    ctx.fillRect(Math.floor(x), Math.floor(y + h * 0.4), w, h * 0.6);
    ctx.fillRect(Math.floor(x + w * 0.35), Math.floor(y), w * 0.3, h * 0.5);
    ctx.fillRect(Math.floor(x + w * 0.15), Math.floor(y + h * 0.55), w * 0.7, 4);
  }

  function drawHud() {
    ctx.fillStyle = '#8899aa';
    ctx.font = '14px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('SCORE ' + score, 12, 22);
    ctx.textAlign = 'center';
    ctx.fillText('WAVE ' + wave, W / 2, 22);
    ctx.textAlign = 'right';
    ctx.fillText('LIVES ' + lives, W - 12, 22);
    ctx.textAlign = 'left';
    ctx.fillText('HI ' + hiScore, 12, 38);
    if (muted) {
      ctx.textAlign = 'right';
      ctx.fillText('MUTE', W - 12, 38);
    }
  }

  function drawHighScoreTable(x, y, title) {
    const list = loadHighScores();
    ctx.fillStyle = '#ccddee';
    ctx.font = 'bold 16px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(title, W / 2, y);
    ctx.font = '13px monospace';
    let yy = y + 22;
    if (!list.length) {
      ctx.fillStyle = '#667788';
      ctx.fillText(storageOk ? 'NO SCORES YET' : 'SCORES UNAVAILABLE', W / 2, yy + 10);
      return;
    }
    for (let i = 0; i < Math.min(MAX_HS, list.length); i++) {
      const e = list[i];
      ctx.fillStyle = i < 3 ? '#ffc850' : '#99aabb';
      const rank = String(i + 1).padStart(2, ' ');
      ctx.fillText(rank + '  ' + e.initials + '  ' + e.score, W / 2, yy);
      yy += 18;
    }
  }

  function syncClassicLink() {
    const link = document.getElementById('ver-link');
    if (!link) return;
    const show = state === 'start' || state === 'gameover' || state === 'scores' || state === 'initials';
    link.hidden = !show;
  }

  function draw() {
    syncClassicLink();
    let ox = 0, oy = 0;
    if (shakeT > 0) {
      ox = (Math.random() - 0.5) * 8;
      oy = (Math.random() - 0.5) * 8;
    }
    ctx.save();
    ctx.translate(ox, oy);

    ctx.fillStyle = '#050810';
    ctx.fillRect(0, 0, W, H);

    if (state === 'start') {
      ctx.fillStyle = '#00e5ff';
      ctx.font = 'bold 28px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('LANE DEFENSE', W / 2, H * 0.14);
      ctx.fillStyle = '#99aabb';
      ctx.font = '13px monospace';
      ctx.fillText('← → / A D move · SPACE fire · P pause · R restart · M mute', W / 2, H * 0.22);
      ctx.fillStyle = '#7cff6b';
      ctx.fillText(isTouch ? 'TAP TO START' : 'PRESS ENTER OR TAP', W / 2, H * 0.30);
      drawHighScoreTable(W / 2, H * 0.36, 'TOP SCORES');
      ctx.fillStyle = '#556677';
      ctx.font = '10px monospace';
      ctx.textAlign = 'right';
      ctx.fillText(BUILD_VERSION, W - 10, H - 10);
      ctx.restore();
      return;
    }

    drawHud();

    for (const shield of shields) {
      for (const b of shield) {
        if (!b.alive) continue;
        ctx.fillStyle = '#6bdc5a';
        ctx.fillRect(Math.floor(b.x), Math.floor(b.y), b.w, b.h);
      }
    }

    for (const inv of invaders) {
      if (inv.alive) drawInvader(inv);
    }

    if (bullet) {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(Math.floor(bullet.x), Math.floor(bullet.y), bullet.w, bullet.h);
    }

    for (const b of invaderBullets) {
      ctx.fillStyle = '#ff6666';
      ctx.fillRect(Math.floor(b.x), Math.floor(b.y), b.w, b.h);
    }

    if (state !== 'gameover') drawPlayer();

    if (state === 'paused') {
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#00e5ff';
      ctx.font = 'bold 24px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('PAUSED', W / 2, H / 2);
      ctx.font = '14px monospace';
      ctx.fillStyle = '#99aabb';
      ctx.fillText('P to resume', W / 2, H / 2 + 28);
    }

    if (state === 'gameover') {
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#ff4466';
      ctx.font = 'bold 28px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('GAME OVER', W / 2, H * 0.38);
      ctx.fillStyle = '#ffffff';
      ctx.font = '18px monospace';
      ctx.fillText('SCORE ' + score, W / 2, H * 0.45);
      ctx.fillStyle = '#99aabb';
      ctx.font = '14px monospace';
      ctx.fillText('R to retry' + (isTouch ? ' · TAP' : ''), W / 2, H * 0.52);
    }

    if (state === 'initials') {
      ctx.fillStyle = 'rgba(0,0,0,0.75)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#ffc850';
      ctx.font = 'bold 18px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('NEW HIGH SCORE!', W / 2, H * 0.32);
      ctx.fillStyle = '#ffffff';
      ctx.fillText('SCORE ' + pendingScore, W / 2, H * 0.38);
      ctx.fillStyle = '#99aabb';
      ctx.font = '12px monospace';
      ctx.fillText('ENTER INITIALS', W / 2, H * 0.44);
      const letterSpacing = 56;
      const startX = W / 2 - letterSpacing;
      const centerY = H * 0.52;
      for (let i = 0; i < 3; i++) {
        const lx = startX + i * letterSpacing;
        ctx.fillStyle = i === initialIdx ? '#00e5ff' : '#445566';
        ctx.fillRect(lx - 28, centerY - 32, 56, 64);
        ctx.fillStyle = i === initialIdx ? '#001018' : '#aabbcc';
        ctx.font = 'bold 36px monospace';
        ctx.fillText(initials[i], lx, centerY + 12);
      }
      ctx.fillStyle = '#7cff6b';
      ctx.fillRect(W / 2 - 50, centerY + 52, 100, 36);
      ctx.fillStyle = '#050810';
      ctx.font = 'bold 14px monospace';
      ctx.fillText('OK', W / 2, centerY + 76);
      if (isTouch) {
        ctx.fillStyle = '#667788';
        ctx.font = '11px monospace';
        ctx.fillText('TAP LETTER · UP/DN · OK', W / 2, centerY + 100);
      }
    }

    if (state === 'scores') {
      ctx.fillStyle = 'rgba(0,0,0,0.8)';
      ctx.fillRect(0, 0, W, H);
      drawHighScoreTable(W / 2, H * 0.28, 'TOP SCORES');
      ctx.fillStyle = '#99aabb';
      ctx.font = '13px monospace';
      ctx.fillText('TAP OR ENTER FOR TITLE', W / 2, H * 0.78);
    }

    ctx.restore();
  }

  function loop(t) {
    const dt = Math.min(0.05, (t - lastT) / 1000 || 0);
    lastT = t;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  updateHiFromStorage();
  resetGame(true);
  requestAnimationFrame(loop);

  window.__ldAudioDiag = () => ({
    state: audioCtx ? audioCtx.state : 'none',
    needsUnlock: audioNeedsUnlock,
    version: BUILD_VERSION,
  });
})();
  </script>
</body>
